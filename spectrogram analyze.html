<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local Spectrogram</title>
<style>
:root{--bg:#f6f6f4;--fg:#1a1a1a;--dim:#6b6b6b;--panel:#fff;--line:#d8d8d4;--ac:#5b3fd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--fg:#e8e8ea;--dim:#8d8d96;--panel:#17171c;--line:#2a2a32;--ac:#9b86ff}}
:root[data-theme="dark"]{--bg:#0e0e11;--fg:#e8e8ea;--dim:#8d8d96;--panel:#17171c;--line:#2a2a32;--ac:#9b86ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1400px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 14px;font-size:13px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:var(--panel)}
.drop.over,.drop:hover{border-color:var(--ac)}
.drop input{display:none}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin:14px 0}
.ctl select{width:100%;min-height:38px}
.ctl label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim)}
select,input[type=range]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px}
input[type=range]{padding:0;width:100%;height:32px}
#info,#hover,#st,#selftest{font-size:12px;color:var(--dim);margin:6px 0;min-height:16px}
#hover{color:var(--fg);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;color:#fff;background:var(--ac);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#verdict{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;margin:10px 0}
#verdict p{margin:6px 0 0;font-size:13px;color:var(--dim)}
#verdict details{margin-top:8px}.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:0 28px}#verdict h4{margin:14px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.k{color:var(--dim)}.k small{display:block;font-size:11px;opacity:.75}.v{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}#verdict summary{cursor:pointer;color:var(--ac);font-size:13px;min-height:24px}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;color:#fff;font-weight:700;margin-right:10px}
#verdict .badge{margin-bottom:4px}
.ok{background:#1f8f4e}.warn{background:#c98500}.bad{background:#cc3d3d}
#wrap{width:100%;overflow-x:auto}
canvas{display:block;border-radius:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{min-height:40px}
#hover{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:4px 0;z-index:1}
canvas{touch-action:pan-y;max-width:100%}
@media (max-width:600px){main{padding:10px}.sub{font-size:12px}.ctl{grid-template-columns:1fr 1fr}select{font-size:16px}.btns button{flex:1}#verdict{padding:10px}}
@media (pointer:coarse){button,select{min-height:44px}}
.ic{width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gc{color:#1f8f4e}.rc{color:#cc3d3d}
</style>
</head>
<body>
<main>
<h1>Local Spectrogram</h1>
<p class="sub">Runs entirely in your browser. Nothing is uploaded.</p>
<label class="drop" id="drop">Drop an audio file here or tap to choose<input type="file" id="file" accept="audio/*,.flac,.wav,.mp3,.m4a,.ogg,.opus,.aac"></label>
<div class="ctl">
<label>Preset<select id="pre"><option value="best">Best detail</option><option value="bal" selected>Balanced</option><option value="bass">Low frequency</option><option value="fast">Quick preview</option><option value="custom">Custom</option></select></label>
<label>Window size<select id="win"><option>512</option><option>1024</option><option>2048</option><option selected>4096</option><option>8192</option><option>16384</option><option>32768</option></select></label>
<label>Window function<select id="wfn"><option value="hann" selected>Hann</option><option value="hamming">Hamming</option><option value="blackman">Blackman</option><option value="bh">Blackman-Harris</option><option value="rect">Rectangular</option></select></label>
<label>Channels<select id="chm"><option value="all" selected>Separate</option><option value="mix">Mono mix</option></select></label>
<label>Frequency scale<select id="fsc"><option value="lin" selected>Linear</option><option value="log">Logarithmic</option></select></label>
<label>Palette<select id="pal"><option value="spek">Spek</option><option value="magma">Magma</option><option value="gray">Grayscale</option></select></label>
<label>Floor <span id="mnv">-120 dB</span><input type="range" id="mn" min="-160" max="-40" value="-120"></label>
<label>Ceiling <span id="mxv">0 dB</span><input type="range" id="mx" min="-40" max="0" value="0"></label>
</div>
<div class="btns"><button id="dl" disabled>Download PNG</button><button id="test">Run self-test</button></div>
<div id="selftest"></div>
<div id="st"></div>
<div id="verdict" hidden></div>
<div id="info"></div>
<div id="hover">&nbsp;</div>
<div id="wrap"><canvas id="c" hidden></canvas></div>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ic=(p,c='')=>'<svg class="ic '+c+'" viewBox="0 0 24 24">'+p+'</svg>',I={
box:ic('<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="m7.5 4.27 9 5.15"/>'),
help:ic('<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'),
down:ic('<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>'),
warn:ic('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),
ok:ic('<path d="M20 6 9 17l-5-5"/>','gc'),
no:ic('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>','rc')};
const canvas=$('c'),ctx=canvas.getContext('2d');
const PAL={
spek:[[0,0,0,0],[.1,0,0,110],[.3,122,10,156],[.5,208,28,60],[.7,245,116,26],[.88,252,230,30],[1,255,255,255]],
magma:[[0,0,0,4],[.25,81,18,124],[.5,183,55,121],[.75,252,137,97],[1,252,253,191]],
gray:[[0,0,0,0],[1,255,255,255]]};
let audio=null,sr=0,name='',note='',chans=[],mats=[],rows=0,cols=0,job=0,geo=null,bw=0,logScale=false,fmt=['Unknown',null],cutoffHz=0,vj=0,declBits=0,tag=null;

function lut(n){const s=PAL[n],o=new Uint8Array(3072);for(let i=0;i<1024;i++){const t=i/1023;let k=1;while(k<s.length-1&&s[k][0]<t)k++;const a=s[k-1],b=s[k],f=(t-a[0])/(b[0]-a[0]);for(let j=0;j<3;j++)o[i*3+j]=a[j+1]+(b[j+1]-a[j+1])*f}return o}
function fmtT(t){if(t>=60){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}return +t.toFixed(2)+'s'}
function status(s){$('st').textContent=s}
const fAt=u=>logScale?20*Math.pow(sr/40,u):u*sr/2;
const uAt=f=>logScale?Math.log(f/20)/Math.log(sr/40):f/(sr/2);

function detectRate(buf){
const b=new Uint8Array(buf),dv=new DataView(buf),L=b.length;
const tag=(i,s)=>{if(i<0||i+s.length>L)return false;for(let k=0;k<s.length;k++)if(b[i+k]!==s.charCodeAt(k))return false;return true};
fmt=['Unknown',null];declBits=0;
if(tag(0,'RIFF')||tag(0,'RF64')){let p=12;while(p+8<=L){const sz=dv.getUint32(p+4,true);if(tag(p,'fmt ')){const t=dv.getUint16(p+8,true);declBits=dv.getUint16(p+22,true);fmt=t===1||t===3||t===65534?['WAV (PCM)',false]:t===85?['MP3 in WAV',true]:['WAV (codec '+t+')',true];return dv.getUint32(p+12,true)}p+=8+sz+(sz&1)}}
if(tag(0,'FORM')&&tag(8,'AIF')){fmt=['AIFF',false];let p=12;while(p+8<=L){const sz=dv.getUint32(p+4,false);if(tag(p,'COMM')){declBits=dv.getUint16(p+14,false);const e=dv.getUint16(p+16,false),m=dv.getUint32(p+18,false);return Math.round(m*Math.pow(2,e-16414))}p+=8+sz+(sz&1)}}
if(tag(0,'fLaC')){fmt=['FLAC',false];declBits=(((b[20]&1)<<4)|(b[21]>>4))+1;return(b[18]<<12)|(b[19]<<4)|(b[20]>>4)}
if(tag(0,'OggS')){const e=Math.min(L-20,8192);for(let i=0;i<e;i++){if(b[i]===1&&tag(i+1,'vorbis')){fmt=['Ogg Vorbis',true];return dv.getUint32(i+12,true)}if(tag(i,'OpusHead')){fmt=['Opus',true];return 48000}if(tag(i,'\x7fFLAC')){fmt=['Ogg FLAC',false];return(b[i+27]<<12)|(b[i+28]<<4)|(b[i+29]>>4)}}}
if(tag(0,'wvpk')){fmt=['WavPack',false];return 0}if(tag(0,'MAC ')){fmt=["Monkey's Audio",false];return 0}if(tag(0,'\x1a\x45\xdf\xa3')){fmt=['Matroska/WebM',null];return 0}
if(tag(4,'ftyp')){for(let i=0;i<L-32;i++){if(tag(i,'mp4a')){fmt=['AAC (M4A)',true];return dv.getUint16(i+28,false)}if(tag(i,'alac')){fmt=['ALAC',false];return dv.getUint16(i+28,false)}}}
let p=0;if(tag(0,'ID3'))p=10+(((b[6]&127)<<21)|((b[7]&127)<<14)|((b[8]&127)<<7)|(b[9]&127));
const e=Math.min(L-4,p+131072);
for(let i=p;i<e;i++){if(b[i]===255&&(b[i+1]&246)===240){const ix=(b[i+2]>>2)&15;if(ix<12){fmt=['AAC (ADTS)',true];return[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000][ix]}}
if(b[i]===255&&(b[i+1]&224)===224){const v=(b[i+1]>>3)&3,ly=(b[i+1]>>1)&3,ix=(b[i+2]>>2)&3;if(v===1||ly===0||ix===3)continue;const t={3:[44100,48000,32000],2:[22050,24000,16000],0:[11025,12000,8000]};fmt=['MP3',true];return t[v][ix]}}
return 0}

function encTag(buf){
const b=new Uint8Array(buf,0,Math.min(buf.byteLength,65536)),L=b.length;
const txt=(p,n)=>{let s='';for(let k=0;k<n&&p+k<L&&b[p+k]>=32&&b[p+k]<127;k++)s+=String.fromCharCode(b[p+k]);return s};
const at=s=>{for(let i=0;i<=L-s.length;i++){let k=0;while(k<s.length&&b[i+k]===s.charCodeAt(k))k++;if(k===s.length)return i}return-1};
let p=at('LAME');
if(p>=0){const n=txt(p,9);if(/^LAME\d/.test(n))return{name:n,lp:b[p+10]*100}}
for(const s of['ENCODER=','libFLAC','Lavf','Lavc']){p=at(s);if(p>=0)return{name:txt(p,40),lp:0}}
return null}

function gridBits(d,len,stride){
const u=new Set();
for(let i=0;i<len&&u.size<20000;i+=stride){const x=Math.abs(d[i]);if(x>0)u.add(x)}
const v=Array.from(u).sort((a,b)=>a-b);
if(v.length<200)return 0;
let step=Infinity;
for(let i=1;i<v.length;i++)step=Math.min(step,v[i]-v[i-1]);
if(!(step>5e-8))return 0;
let fit=0,q=step;
for(const x of v){const r=x/q,n=Math.round(r);if(n>=1&&Math.abs(r-n)<.25){fit++;q=x/n}}
return fit>=.98*v.length?Math.log2(1/q)+1:0}

const tick=(()=>{const ch=new MessageChannel(),q=[];ch.port1.onmessage=()=>{q.splice(0).forEach(f=>f())};return()=>new Promise(r=>{q.push(r);ch.port2.postMessage(0)})})();
const LE=new Uint8Array(new Uint32Array([1]).buffer)[0]===1;let img=null,u32=null,dq=0;
let busy=0,testing=false;
const track=p=>{busy++;$('test').disabled=true;return p.finally(()=>{if(!--busy&&!testing)$('test').disabled=false})};
const redraw=()=>{dq||(dq=requestAnimationFrame(()=>{dq=0;draw()}))};
function makeFFT(N){const bits=Math.log2(N),rev=new Uint32Array(N),wr=new Float64Array(N),wi=new Float64Array(N);
for(let i=0;i<N;i++){let r=0;for(let b=0;b<bits;b++)r|=((i>>b)&1)<<(bits-1-b);rev[i]=r}
for(let h=1;h<N;h<<=1)for(let k=0;k<h;k++){const a=Math.PI*k/h;wr[h+k]=Math.cos(a);wi[h+k]=-Math.sin(a)}
return{rev,run(re,im){
for(let s=0;s<N;s+=2){const xr=re[s+1],xi=im[s+1];re[s+1]=re[s]-xr;im[s+1]=im[s]-xi;re[s]+=xr;im[s]+=xi}
for(let h=2;h<N;h<<=1)for(let s=0;s<N;s+=h<<1)for(let k=0;k<h;k++){const a=s+k,b=a+h,c=wr[h+k],d=wi[h+k],xr=re[b]*c-im[b]*d,xi=re[b]*d+im[b]*c;re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi}}}}
function layout(){
const n=chans.length,W=Math.max(300,$('wrap').clientWidth);lastW=W;
const sm=W<640,left=sm?44:58,right=sm?64:78,top=34,bottom=38,gap=sm?24:30,chH=n===1?(sm?300:380):(sm?200:260),plotW=W-left-right,H=top+n*chH+(n-1)*gap+bottom,dpr=Math.min(window.devicePixelRatio||1,Math.sqrt(16e6/(W*H)));
canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';
cols=Math.round(plotW*dpr);rows=Math.round(chH*dpr);
geo={W,H,left,right,top,bottom,gap,chH,plotW,n,dpr}}

async function analyze(){
if(!audio)return;
const id=++job,N=+$('win').value,half=N/2,wt=$('wfn').value,nch=audio.numberOfChannels;
if($('chm').value==='mix'&&nch>1){const len=audio.length,mix=new Float32Array(len);for(let c=0;c<nch;c++){const d=audio.getChannelData(c);for(let i=0;i<len;i++)mix[i]+=d[i]/nch}chans=[mix]}
else chans=Array.from({length:nch},(_,i)=>audio.getChannelData(i));
mats=[];layout();canvas.hidden=false;
const w=new Float64Array(N);let ws=0;
for(let i=0;i<N;i++){const x=2*Math.PI*i/N;w[i]=wt==='hann'?.5-.5*Math.cos(x):wt==='hamming'?.54-.46*Math.cos(x):wt==='blackman'?.42-.5*Math.cos(x)+.08*Math.cos(2*x):wt==='bh'?.35875-.48829*Math.cos(x)+.14128*Math.cos(2*x)-.01168*Math.cos(3*x):1;ws+=w[i]}
const norm=2/ws,nq=norm*norm*.25,F=makeFFT(N),rev=F.rev;


const re=new Float64Array(N),im=new Float64Array(N),A=new Float64Array(half+1),B=new Float64Array(half+1);
logScale=$('fsc').value==='log';
const rl=new Int32Array(rows),rh=new Int32Array(rows),rf=new Float32Array(rows),rm=new Uint8Array(rows);
for(let r=0;r<rows;r++){const b0=fAt(r/rows)/(sr/2)*half,b1=fAt((r+1)/rows)/(sr/2)*half;if(b1-b0>=1){rm[r]=1;rl[r]=Math.min(half,Math.round(b0));rh[r]=Math.min(half,Math.max(rl[r],Math.round(b1)-1))}else{const p=(b0+b1)/2;rl[r]=Math.min(half-1,Math.floor(p));rf[r]=p-rl[r]}}
let ki=0;for(let r=0;r<rows;r++)if(!rm[r])ki=Math.max(ki,rl[r]+1);
const D=new Float64Array(ki+2),E=new Float64Array(ki+2);let Kc=1;
const put=(m,c,a,d)=>{const base=c*rows;for(let r=0;r<rows;r++){if(rm[r]){let v=a[rl[r]];for(let k=rl[r]+1;k<=rh[r];k++)if(a[k]>v)v=a[k];m[base+r]=10*Math.log10(Math.max(v/Kc,1e-24))}else m[base+r]=d[rl[r]]*(1-rf[r])+d[rl[r]+1]*rf[r]}};
let last=performance.now();
for(let ch=0;ch<chans.length;ch++){
const d=chans[ch],len=d.length,K=Math.max(1,Math.min(8,Math.floor(len/cols/N))),m=new Float32Array(cols*rows);Kc=K;
for(let c=0;c<cols;c+=2){
const two=c+1<cols;A.fill(0);B.fill(0);
for(let q=0;q<K;q++){const s0=Math.round((c+(q+.5)/K)/cols*len-N/2),s1=Math.round((c+1+(q+.5)/K)/cols*len-N/2);
for(let i=0;i<N;i++){const a=s0+i,b=s1+i,j=rev[i];re[j]=a>=0&&a<len?d[a]*w[i]:0;im[j]=two&&b>=0&&b<len?d[b]*w[i]:0}

F.run(re,im);
for(let k=0;k<=half;k++){const k2=(N-k)&(N-1),pa=re[k]+re[k2],pb=im[k]-im[k2],pc=im[k]+im[k2],pd=re[k]-re[k2];A[k]+=nq*(pa*pa+pb*pb);B[k]+=nq*(pc*pc+pd*pd)}}
A[0]*=.25;A[half]*=.25;B[0]*=.25;B[half]*=.25;
for(let k=0;k<=ki;k++){D[k]=10*Math.log10(Math.max(A[k]/K,1e-24));E[k]=10*Math.log10(Math.max(B[k]/K,1e-24))}
put(m,c,A,D);if(two)put(m,c+1,B,E);
if(performance.now()-last>40){status('Analyzing... channel '+(ch+1)+'/'+chans.length+', '+Math.round(c/cols*100)+'%');await tick();if(id!==job)return;last=performance.now()}}
mats.push(m)}

bw=0;for(const m of mats){const s=new Float64Array(rows);for(let c=0;c<cols;c++){const o=c*rows;for(let r=0;r<rows;r++)s[r]+=m[o+r]}for(let r=rows-1;r>=0;r--)if(s[r]/cols>-90){bw=Math.max(bw,fAt((r+1)/rows));break}}
status(note);$('dl').disabled=false;
$('info').textContent=sr+' Hz | '+nch+' ch | '+fmtT(audio.duration)+' | window '+N+' ('+(sr/N).toFixed(2)+' Hz/bin) | content above -90 dB to ~'+(bw/1000).toFixed(1)+' kHz';$('info').title=name;
draw()}

function draw(){
if(!geo||mats.length<geo.n)return;
const g=geo,st=getComputedStyle(document.documentElement),fg=st.getPropertyValue('--fg').trim(),dim=st.getPropertyValue('--dim').trim(),bg=st.getPropertyValue('--bg').trim();
const lo=+$('mn').value,hi=Math.max(+$('mx').value,lo+1),span=hi-lo,L=lut($('pal').value),nyq=sr/2;
ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);
if(!img||img.width!==cols||img.height!==rows){img=ctx.createImageData(cols,rows);u32=new Uint32Array(img.data.buffer)}
const L32=new Uint32Array(1024);for(let i=0;i<1024;i++){const j=i*3;L32[i]=LE?(0xff000000|L[j+2]<<16|L[j+1]<<8|L[j])>>>0:((L[j]<<24|L[j+1]<<16|L[j+2]<<8|255)>>>0)}
for(let ch=0;ch<g.n;ch++){
const m=mats[ch];
for(let c0=0;c0<cols;c0+=32){const c1=Math.min(cols,c0+32);for(let r=0;r<rows;r++){const o=(rows-1-r)*cols;for(let c=c0;c<c1;c++){let t=(m[c*rows+r]-lo)/span;t=t<0?0:t>1?1:t;u32[o+c]=L32[(t*1023)|0]}}}
ctx.putImageData(img,Math.round(g.left*g.dpr),Math.round((g.top+ch*(g.chH+g.gap))*g.dpr))}
ctx.setTransform(g.dpr,0,0,g.dpr,0,0);
ctx.font='11px system-ui,sans-serif';ctx.fillStyle=fg;ctx.strokeStyle=dim;ctx.lineWidth=1;
ctx.textAlign='left';ctx.textBaseline='alphabetic';
{const sfx=' | '+sr+' Hz, '+audio.numberOfChannels+' ch, '+fmtT(audio.duration),mw=g.plotW,t=n=>name.slice(0,n)+'\u2026'+sfx;let txt=name+sfx;
if(ctx.measureText(txt).width>mw){let lo=0,hi=name.length;while(lo<hi){const m=(lo+hi+1)>>1;if(ctx.measureText(t(m)).width<=mw)lo=m;else hi=m-1}txt=t(lo)}

for(let i=0;i<r.length;i++)r[i]=Math.random()*2-1;
for(let i=0;i<n;i++){let a=0;for(let k=0;k<T;k++)a+=h[k]*r[i+k];o[i]=a*.3}return o};
const q=()=>{const o=new Float32Array(n);for(let i=0;i<n;i++)o[i]=Math.fround(Math.round((Math.random()*2-1)*20000)/32768*.7);return o};
const q24=()=>{const o=new Float32Array(n);for(let i=0;i<n;i++)o[i]=Math.fround(Math.round((Math.random()*2-1)*2e6)/8388607);return o};
const cases=[
['Full-band noise reads as lossless',()=>[noise(),noise()],['FLAC',false],16,/Lossless.*Confidence: High/],
['16 kHz lowpass reads as a lossy transcode',()=>[lp(16000),lp(16000)],['FLAC',false],16,/Lossy source|lossy transcode/],
['Identical channels give Dual mono',()=>{const a=noise();return[a,a]},['FLAC',false],16,/Dual mono/],
['Non-standard decoder scale still reads as 24-bit',()=>[q24(),q24()],['WAV (PCM)',false],24,/effective ~24-bit/],
['Gain-scaled 16-bit labeled 24-bit is fake',()=>[q(),q()],['WAV (PCM)',false],24,/Fake 24-bit/]];
const res=[];
for(const c of cases){status('Self-test: '+c[0]+'...');await tick();
const ch=c[1]();audio={numberOfChannels:2,length:n,sampleRate:rate,duration:n/rate,getChannelData:i=>ch[i]};sr=rate;fmt=c[2];declBits=c[3];note='';tag=null;
await runVerdict();res.push((c[4].test($('verdict').textContent)?I.ok+' ':I.no+' ')+c[0])}
{const m=rate*300,x=new Float32Array(m);for(let i=m>>1;i<m;i++)x[i]=.5*Math.sin(Math.PI/4*i);
audio={numberOfChannels:1,length:m,sampleRate:rate,duration:m/rate,getChannelData:()=>x};sr=rate;
$('win').value='4096';$('fsc').value='lin';$('chm').value='all';
await analyze();const at=q=>Math.floor(cols*q)*rows;let pk=-999,pr=0;for(let r=0;r<rows;r++)if(mats[0][at(.75)+r]>pk){pk=mats[0][at(.75)+r];pr=r}
const f=fAt((pr+.5)/rows),lo=mats[0][at(.25)+pr];
res.push((Math.abs(pk+6.02)<.2&&Math.abs(f-rate/8)<rate/rows&&lo<-100?I.ok+' ':I.no+' ')+'Spectrogram: 5 min file, 0.5 sine from the halfway point reads -6 dBFS at '+rate/8+' Hz (got '+pk.toFixed(1)+' dB at '+f.toFixed(0)+' Hz), silent before it ('+lo.toFixed(0)+' dB)')}
const ok=res.filter(l=>l.startsWith(I.ok)).length;
out.innerHTML='<div><b>TL;DR: '+ok+'/'+res.length+' checks passed'+(ok<res.length?' ('+(res.length-ok)+' failed, do not trust the verdicts)':'')+'.</b></div>'+res.map(l=>'<div>'+l+'</div>').join('')}
async function selfTest(){
if(busy||testing)return;testing=true;
const keep={audio,sr,fmt,note,declBits,tag,cutoffHz},ids=['win','fsc','chm'],ui=ids.map(i=>$(i).value),ctl=[$('test'),$('file')];
ctl.forEach(e=>e.disabled=true);
try{await selfTestRun()}catch(e){$('selftest').textContent='Self-test failed: '+e.message}
ids.forEach((i,k)=>$(i).value=ui[k]);
({audio,sr,fmt,note,declBits,tag,cutoffHz}=keep);status('');
try{if(audio){await runVerdict();await analyze()}else{$('verdict').hidden=true;canvas.hidden=true;mats=[];$('dl').disabled=true;$('info').textContent=''}}catch(e){status('Analysis failed: '+e.message)}
testing=false;ctl.forEach(e=>e.disabled=false)}
$('test').addEventListener('click',selfTest);

let loadJ=0,loadedKey='',pendingKey='';
const load=f=>track(loadImpl(f));
async function loadImpl(file){
if(testing)return;
const key=file.name+'|'+file.size+'|'+file.lastModified;
if(key===pendingKey)return;
if(key===loadedKey&&audio){status('This file is already loaded.');return}
loadedKey='';pendingKey=key;const lid=++loadJ;++job;++vj;
try{
status('Decoding...');
const buf=await file.arrayBuffer();if(lid!==loadJ)return;
let rate=0;try{rate=detectRate(buf)}catch(e){}try{tag=encTag(buf)}catch(e){tag=null}
let a=null;
try{a=await new OfflineAudioContext(1,1,rate||44100).decodeAudioData(buf)}
catch(e){a=await new OfflineAudioContext(1,1,44100).decodeAudioData(await file.arrayBuffer())}
if(lid!==loadJ)return;
audio=a;sr=a.sampleRate;name=file.name;loadedKey=key;pendingKey='';
note=!rate?'Native sample rate could not be read from the file header; the axis assumes '+sr+' Hz.':rate!==sr?'Browser could not decode at the native '+rate+' Hz; axis shows '+sr+' Hz.':'';
}
catch(e){if(lid===loadJ){audio=null;pendingKey='';status('Could not decode this file ('+(e&&e.message||'unknown error')+'). Supported formats depend on your browser.')}return}
try{await analyze();if(lid!==loadJ)return;await runVerdict();if(lid!==loadJ)return;status(note);draw()}catch(e){status('Analysis failed: '+e.message)}}












$('file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)load(f)});
const dz=$('drop');
['dragenter','dragover'].forEach(t=>window.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(t=>window.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
window.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)load(f)});
const safe=()=>testing?Promise.resolve():track(analyze()).catch(e=>status('Analysis failed: '+e.message));
['win','wfn','chm','fsc'].forEach(i=>$(i).addEventListener('change',safe));
const PRE={best:['8192','bh','all','lin','spek',-130,0],bal:['4096','hann','all','lin','spek',-120,0],bass:['32768','bh','all','log','spek',-120,0],fast:['2048','hann','mix','lin','spek',-100,0]},IDS=['win','wfn','chm','fsc','pal','mn','mx'];
$('pre').addEventListener('change',()=>{const v=PRE[$('pre').value];if(!v)return;IDS.forEach((id,i)=>$(id).value=v[i]);$('mnv').textContent=v[5]+' dB';$('mxv').textContent=v[6]+' dB';if(audio)safe()});
IDS.forEach(id=>$(id).addEventListener(id==='mn'||id==='mx'?'input':'change',()=>$('pre').value='custom'));
$('pal').addEventListener('change',redraw);
$('mn').addEventListener('input',()=>{$('mnv').textContent=$('mn').value+' dB';redraw()});
$('mx').addEventListener('input',()=>{$('mxv').textContent=$('mx').value+' dB';redraw()});
let rt=0,lastW=0;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const w=Math.max(300,$('wrap').clientWidth);if(audio&&w!==lastW){lastW=w;safe()}},250)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);
const probe=e=>{
if(!geo||mats.length<geo.n)return;
const r=canvas.getBoundingClientRect(),x=e.clientX-r.left-geo.left,y=e.clientY-r.top-geo.top,ch=Math.floor(y/(geo.chH+geo.gap)),yy=y-ch*(geo.chH+geo.gap);
if(x<0||x>=geo.plotW||ch<0||ch>=geo.n||yy>geo.chH){$('hover').innerHTML='&nbsp;';return}
const c=Math.min(cols-1,Math.floor(x/geo.plotW*cols)),rw=Math.min(rows-1,Math.max(0,Math.floor((1-yy/geo.chH)*rows)));
$('hover').textContent=fmtT(x/geo.plotW*audio.duration)+' | '+(fAt((rw+.5)/rows)/1000).toFixed(3)+' kHz | '+mats[ch][c*rows+rw].toFixed(1)+' dBFS'};
['pointermove','pointerdown'].forEach(t=>canvas.addEventListener(t,probe));
canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')$('hover').innerHTML='&nbsp;'});
$('dl').addEventListener('click',()=>{
canvas.toBlob(blob=>{if(!blob){status('PNG too large for this browser.');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name.replace(/\.[^.]+$/,'')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/png')});
</script>
